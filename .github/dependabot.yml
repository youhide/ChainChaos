version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR for compatible updates instead of one per crate.
      cargo-minor:
        update-types: [minor, patch]
    ignore:
      # Pinned to the version axum uses internally, so only one copy is
      # compiled. Bump together with axum.
      - dependency-name: tokio-tungstenite

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # Refs of this action select the Rust toolchain (`@stable`, `@master`),
      # not a release of the action.
      - dependency-name: dtolnay/rust-toolchain
