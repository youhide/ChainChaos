name: Release

# Builds prebuilt binaries for macOS and Linux, publishes a GitHub release,
# and pushes a multi-arch image to ghcr.io/youhide/chainchaos.
#
# Archive names follow GoReleaser's convention (chainchaos_Darwin_arm64.tar.gz,
# ...) and checksums.txt is published beside them: youhide/homebrew-tap reads
# both from the release to regenerate the formula on its own.

on:
  push:
    tags:
      - "v*"
  # Manual runs build the archives without publishing anything.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: chainchaos_Darwin_arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: chainchaos_Darwin_x86_64
          # Pinned (not -latest): the Docker image's glibc must match.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            archive: chainchaos_Linux_x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive: chainchaos_Linux_arm64
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          crate_version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if [ "v${crate_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match workspace version ${crate_version}"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked -p chainchaos --target ${{ matrix.target }}

      - name: Smoke test
        run: target/${{ matrix.target }}/release/chainchaos --version

      - name: Package
        run: |
          mkdir -p pkg dist
          cp target/${{ matrix.target }}/release/chainchaos README.md LICENSE pkg/
          tar -C pkg -czf "dist/${{ matrix.archive }}.tar.gz" chainchaos README.md LICENSE

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.archive }}
          path: dist/${{ matrix.archive }}.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum *.tar.gz > checksums.txt && cat checksums.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz dist/checksums.txt \
            --title "${GITHUB_REF_NAME}" --generate-notes --verify-tag


  # Tags push the image; manual runs build it for both platforms without
  # pushing, to validate the image before a release.
  docker:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Lay out binaries per Docker platform
        run: |
          mkdir -p docker-bin/amd64 docker-bin/arm64
          tar -xzf dist/chainchaos_Linux_x86_64.tar.gz -C docker-bin/amd64 chainchaos
          tar -xzf dist/chainchaos_Linux_arm64.tar.gz -C docker-bin/arm64 chainchaos

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/chainchaos
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=sha,enable=${{ !startsWith(github.ref, 'refs/tags/') }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: .github/docker/Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
