name: Release

# Builds prebuilt binaries for macOS and Linux, publishes a GitHub release,
# and updates the Homebrew formula in youhide/homebrew-youhide.
#
# Archive names follow the GoReleaser convention used by the other tools in
# the tap (chainchaos_Darwin_arm64.tar.gz, ...), so the shared
# update-tap-formula.sh script works unchanged.

on:
  push:
    tags:
      - "v*"
  # Manual runs build the archives without publishing anything.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: chainchaos_Darwin_arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: chainchaos_Darwin_x86_64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: chainchaos_Linux_x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive: chainchaos_Linux_arm64
    steps:
      - uses: actions/checkout@v5

      - name: Check tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          crate_version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if [ "v${crate_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match workspace version ${crate_version}"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked -p chainchaos --target ${{ matrix.target }}

      - name: Smoke test
        run: target/${{ matrix.target }}/release/chainchaos --version

      - name: Package
        run: |
          mkdir -p pkg dist
          cp target/${{ matrix.target }}/release/chainchaos README.md LICENSE pkg/
          tar -C pkg -czf "dist/${{ matrix.archive }}.tar.gz" chainchaos README.md LICENSE

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.archive }}
          path: dist/${{ matrix.archive }}.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum *.tar.gz > checksums.txt && cat checksums.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz dist/checksums.txt \
            --title "${GITHUB_REF_NAME}" --generate-notes --verify-tag

      - name: Update Homebrew tap formula
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          TAP_REPO: youhide/homebrew-youhide
          RELEASE_REPO: ${{ github.repository }}
          PROJECT_NAME: chainchaos
          FORMULA_NAME: chainchaos
          BINARY_NAME: chainchaos
          DESCRIPTION: "Blockchain-aware JSON-RPC chaos testing proxy for EVM applications"
          HOMEPAGE: "https://github.com/youhide/ChainChaos"
          LICENSE: "MIT"
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "${TAP_TOKEN}" ]; then
            echo "::warning::HOMEBREW_TAP_GITHUB_TOKEN is not set; skipping the Homebrew tap update"
            exit 0
          fi
          bash .github/scripts/update-tap-formula.sh
